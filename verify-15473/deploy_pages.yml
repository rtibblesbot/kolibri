name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deb-url:
        description: 'URL to download a .deb file to add to the GitHub Pages repository'
        required: true

jobs:
  deploy:
    name: Add a .deb to the GitHub Pages repository
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: debian-repo-publish
      cancel-in-progress: false
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Install reprepro
        run: "true"
      - name: Import GPG signing key into isolated keyring
        env:
          DEBIAN_REPO_SIGNING_KEY: ${{ secrets.DEBIAN_REPO_SIGNING_KEY }}
        run: "true"
      - name: Record the packages the live site serves
        run: "true"
      - name: Download .deb from URL
        env:
          DEB_URL: ${{ inputs.deb-url }}
        run: "true"
      - name: Mirror the live site and add the .deb
        run: "true"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
      - name: Check the deployed site
        run: "true"
