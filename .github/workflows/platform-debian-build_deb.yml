name: Build Debian installer

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      tar-url:
        description: 'URL for Kolibri tar file'
        required: true
  workflow_call:
    inputs:
      tar-file-name:
        required: false
        type: string
      tar-url:
        required: false
        type: string
      source-package:
        description: 'Build and check the source package instead of the .deb'
        required: false
        type: boolean
        default: false
    outputs:
      deb-file-name:
        description: "DEB file name"
        value: ${{ jobs.build_deb.outputs.deb-file-name }}
permissions:
  contents: read
env:
  # The sdist builds inside this checkout; keep setuptools_scm off its git.
  SETUPTOOLS_SCM_IGNORE_VCS_ROOTS: ${{ github.workspace }}
jobs:
  build_deb:
    name: Build DEB file
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platforms/debian
    outputs:
      deb-file-name: ${{ steps.get-deb-filename.outputs.deb-file-name }}
    steps:
      - name: Validate tar reference inputs
        if: ${{ (inputs.tar-file-name && inputs.tar-url) || (!inputs.tar-file-name && !inputs.tar-url) }}
        working-directory: ${{ github.workspace }}
        run: |
          echo "Must specify exactly one reference for the tar file to build the DEB with."
          exit 1
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - name: Install Python dependencies for changelog generation
        run: uv sync --package kolibri-installer-debian
      - name: Install Debian build package dependencies
        run: >-
          ../../.github/scripts/apt-install.sh devscripts debhelper dh-python python3-all python3-pytest
          po-debconf python3-setuptools python3-pip python3-distro-info build-essential
      - name: Download the tarfile from URL
        if: ${{ inputs.tar-url }}
        env:
          TAR_URL: ${{ inputs.tar-url }}
        run: make get-tar tar="$TAR_URL"
      - name: Download the tarfile from artifacts
        if: ${{ inputs.tar-file-name }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.tar-file-name }}
          path: platforms/debian/build_src
      - name: Build the source package
        if: ${{ inputs.source-package }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run make kolibri.changes
      - name: Check the bundled Python survives the source round-trip
        if: ${{ inputs.source-package }}
        run: |
          dpkg-source -x dist/*.dsc /tmp/unpacked
          . build_tools/python_versions.env
          for arch in x86_64 aarch64; do
            tarball="/tmp/unpacked/debian/bundled/cpython-$PYTHON_BUILD_STANDALONE_VERSION-$arch-unknown-linux-gnu-install_only_stripped.tar.gz"
            [ -f "$tarball" ] || { echo "FAIL: $tarball missing from source package"; exit 1; }
          done
          cmp build_tools/python_versions.env /tmp/unpacked/debian/bundled/python_versions.env
      - name: Run the build
        if: ${{ !inputs.source-package }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run make kolibri.deb
      - name: Get DEB filename
        if: ${{ !inputs.source-package }}
        id: get-deb-filename
        run: echo "deb-file-name=$(basename dist/*.deb)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.source-package }}
        with:
          name: ${{ steps.get-deb-filename.outputs.deb-file-name }}
          path: platforms/debian/dist/${{ steps.get-deb-filename.outputs.deb-file-name }}
