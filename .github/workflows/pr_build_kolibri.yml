name: Verify 15581 SIGTERM loop
on:
  pull_request:
permissions:
  contents: read
jobs:
  whl:
    name: Build WHL file
    uses: ./.github/workflows/build_whl.yml
  flatpak:
    name: Build Flatpak file
    needs: whl
    uses: ./.github/workflows/platform-gnome-build_flatpak.yml
    with:
      whl-file-name: ${{ needs.whl.outputs.whl-file-name }}
  sigterm_loop:
    name: SIGTERM loop (25 attempts)
    needs: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install host dependencies
        run: .github/scripts/apt-install.sh --no-install-recommends flatpak xvfb dbus-x11 libglib2.0-bin ostree
      - name: Install the GNOME 49 runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.flatpak.outputs.flatpak-file-name }}
      - name: Run SIGTERM loop
        env:
          FLATPAK_FILE_NAME: ${{ needs.flatpak.outputs.flatpak-file-name }}
        run: python3 platforms/flatpak-app/build-aux/flatpak/sigterm_loop.py "$FLATPAK_FILE_NAME"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sigterm-loop-logs
          path: |
            /tmp/smoke-*.log
            ~/.var/app/org.learningequality.Kolibri.Devel/data/kolibri/logs/
